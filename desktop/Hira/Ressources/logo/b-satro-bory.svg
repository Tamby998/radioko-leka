<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="RadiokoLeka">
  <title>RadiokoLeka — B, satro-bory</title>

  <!-- Couleurs du projet, declarees une seule fois.
       Elles viennent de desktop/Hira/Sources/Reglages.swift :
         accent #F2C94C « Or »     — ce qui est actif, en cours, choisi
         second #7BD88F « Menthe » — la progression, les accents discrets -->
  <style>
    .or     { fill: #F2C94C }
    .menthe { fill: #7BD88F }
  </style>

  <!-- Le chapeau vu de dessus : un disque (la calotte) dans un anneau
       (le bord). L anneau est ouvert en haut — c est par la que l onde
       sort, et c est la ou commence la barre de progression. -->
  <path class="menthe" d="
    M 162.9,32.1
    A 102,102 0 1 1 93.1,32.1
    A 10,10   0 0 1 100.0,50.9
    A 82,82   0 1 0 156.0,50.9
    A 10,10   0 0 1 162.9,32.1
    Z"/>

  <!-- La calotte, percee du triangle de lecture (evenodd : un vrai trou,
       donc lisible sur fond clair comme sur fond sombre). Le triangle est
       pose 2 px a droite du centre geometrique : a l oeil il tombe juste. -->
  <path class="or" fill-rule="evenodd" d="
    M 128,128 m -62,0 a 62,62 0 1,0 124,0 a 62,62 0 1,0 -124,0
    Z
    M 106,92 L 178,128 L 106,164 Z"/>
</svg>
